
<html>
<head>
    <title>CSS Positioning</title>
    <style>
        body {
            font-family: Arial;
            height: 1200px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background-color: navy;
            color: white;
            padding: 15px;
        }

        .relative {
            position: relative;
            left: 20px;
            top: 10px;
            width: 200px;
            padding: 20px;
            background-color: lightblue;
        }

        .parent {
            position: relative;
            height: 180px;
            background-color: lightgray;
            margin-top: 30px;
        }

        .absolute {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: orange;
            padding: 15px;
        }

        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: green;
            color: white;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="sticky">Sticky Header</div>

    <h2>Relative Position</h2>
    <div class="relative">Relative Box</div>

    <h2>Absolute Position</h2>
    <div class="parent">
        Parent Container
        <div class="absolute">Absolute Box</div>
    </div>

    <div class="fixed">Fixed Box</div>
</body>
</html>
