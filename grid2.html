<!DOCTYPE html>
<html>
<head>
    <title>Grid Design</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 0;
            width: max-content;
            border: 1px solid purple;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(4, 80px);
        }
        .box {
            height: 85px;
            border: 1px solid brown;
            box-sizing: border-box;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
        </div>
        <div class="row">
            <div class="box">5</div>
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <div class="row">
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">1</div>
            <div class="box">2</div>
        </div>
        <div class="row">
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">1</div>
        </div>
        <div class="row">
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
        </div>
    </div>
</body>
</html>
