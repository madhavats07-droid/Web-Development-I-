<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            padding: 0 20px;
            border: solid red;
            flex-wrap: nowrap;
            flex-direction: row;
            background-color: lightgray;
            grid: row 10px;;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: solid blue;
        }
    </style>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
