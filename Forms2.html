<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <h1>My Portfolio</h1>
    <form>
        <label for="Name">Name:</label>
        <input type="text" id="Name"><br>
        <label for="email">Email:</label>
        <input type="email" id="email id"><br>
        <label for="City">City:</label>
        <select name="City" id="City">
            <option value="Delhi">Delhi</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Chennai">Chennai</option>
        </select>
        <label for="Course">Course:</label>
        <select Course="course" id="course">
            <option value="AI/ML">AI/ML</option>
            <option value="DS">DS</option>
            <option value="Cyber">CyberSecurity</option>
            <option value="AI/DS">AI/DS</option>
        </select><br>
        Html: <input type="checkbox" name ="skills" id="HTML"><br>
        CSS: <input type="checkbox" name ="skills" id="CSS"><br>
        JavaScript: <input type="checkbox" name ="skills" id="JavaScript"><br>
        Python: <input type="checkbox" name ="skills" id="Python"><br>

        <input type="submit"><br>
        <input type="reset"><br>
    </form>
</body>
</html>
