<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            background-color: lightgray;
            font-family: Arial;
            text-align: center;
        }

        /* Class Selector */
        .card {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border: 3px solid black;
            background-color: white;
            position: relative;
        }

        /* Class Selector */
        .name {
            color: blue;
            font-size: 28px;
        }

        /* ID Selector */
        #profileButton {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: 2px solid black;
        }

        /* Class Selector + Absolute Positioning */
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;

            background-color: red;
            color: white;
            padding: 5px 10px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="badge">
            NEW
        </div>

        <h1>MY PROFILE</h1>

        <p class="name">Madhav Vats</p>

        <p>B.Tech CSE Student</p>

        <button id="profileButton">
            View Profile
        </button>

    </div>

</body>
</html>
