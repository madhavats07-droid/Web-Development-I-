<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task</title>
    <style>
        h1{
            color: rgb(98, 23, 117);
            font-size: 30px;
        }
        p{
            color: blue;
            font-size: 20px;
        }
        #para{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .highlight{
            background-color:yellow;
            font-size: 20px;
        }
        #footer{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Main Title</h1>
    <p class="para" id="para">This is a paragraph</p>
    <p class="highlight">This is a highlighted paragraph</p>
    <div id="footer">this is footer information</div>

    
</body>
</html>
